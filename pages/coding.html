<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coding · IntervueAI</title><meta name="description" content="IntervueAI interview preparation workspace (demo with mock data).">
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"></head>
<body data-root="../"><header class="nav" id="nav"></header>
<main class="app">
<section class="ph"><div class="wrap ph-in"><div><p class="eyebrow">Coding</p><h1>Coding practice</h1><p class="lead">Pick a problem, write a solution and run mock tests.</p></div><span class="badge">Demo · mock data</span></div></section>
<section><div class="wrap code-grid"><aside><div class="filters" id="filters"><button class="btn btn-primary" data-l="All">All</button><button class="btn btn-ghost" data-l="Easy">Easy</button><button class="btn btn-ghost" data-l="Medium">Medium</button><button class="btn btn-ghost" data-l="Hard">Hard</button></div><div class="plist" id="plist"></div></aside>
<div><div class="card" style="margin-bottom:20px"><h2 id="ptitle" style="font-size:1.5rem"></h2><p class="lead" id="pdesc" style="margin-top:10px"></p><pre class="code" id="pex" style="margin-top:14px;white-space:pre-wrap"></pre><p id="ptags" style="margin-top:12px"></p></div>
<div class="win"><div class="win-top"><span class="dots"><i></i><i></i><i></i></span><b id="fn">solution.js</b><select id="lang" aria-label="Language" style="width:auto;padding:4px 8px;font-size:.82rem"><option>JavaScript</option><option>Python</option><option>Java</option><option>C++</option></select></div><textarea class="editor" id="code" spellcheck="false" aria-label="Code editor"></textarea></div>
<div class="cta-row" style="margin-top:16px"><button class="btn btn-ghost" id="run">Run</button><button class="btn btn-primary" id="sub">Submit</button></div><div class="card" id="res" style="margin-top:16px"><p class="lead" style="margin:0;font-size:.95rem">Test cases appear here. Results are mocked; no code is executed.</p></div></div></div></section>
</main><footer id="foot"></footer>
<script src="../js/api.js"></script><script src="../js/navbar.js"></script><script src="../js/main.js"></script><script src=../js/coding.js></script>
<script src="../js/chatbot.js"></script>
</body></html>
